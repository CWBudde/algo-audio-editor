pre-commit:
  parallel: true
  jobs:
    - name: biome
      root: apps/editor-web
      glob: "*.{ts,tsx,json}"
      run: bun run lint

    - name: typecheck
      root: apps/editor-web
      glob: "*.{ts,tsx}"
      run: bun run typecheck

    - name: go-vet
      root: packages/kernel
      glob: "*.go"
      run: go vet ./... && GOOS=js GOARCH=wasm go vet ./...
