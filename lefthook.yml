# Pre-commit mirrors the checks CI runs, scoped to staged files where the tool
# allows it. Nothing here rewrites files: a failing format check means
# "run `just fmt` and re-stage".
pre-commit:
  parallel: true
  jobs:
    # Format + lint + import order for every TS/JSON file in the repo, the same
    # rules `biome ci apps packages/protocol` enforces in CI. biome.json's
    # files.includes skips the generated shadcn components; the flags keep
    # biome quiet when every staged file is ignored. Use the workspace-pinned
    # binary (see treefmt.toml).
    - name: biome
      glob: "*.{ts,mts,tsx,json}"
      run: node_modules/.bin/biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

    # packages/protocol is consumed by editor-web via a path alias, so a
    # protocol change has to typecheck there.
    - name: typecheck-web
      glob:
        - "apps/editor-web/**/*.{ts,tsx}"
        - "packages/protocol/**/*.ts"
      run: bun run --bun --cwd apps/editor-web typecheck

    - name: typecheck-desktop
      glob: "apps/desktop/**/*.{ts,mts}"
      run: bun run --bun --cwd apps/desktop typecheck

    # With root set, {staged_files} is relative to packages/kernel.
    - name: gofumpt
      root: packages/kernel
      glob: "*.go"
      run: |
        unformatted="$(gofumpt -l {staged_files})" || exit 1
        if [ -n "$unformatted" ]; then
          printf 'gofumpt: not formatted (run `just fmt`):\n%s\n' "$unformatted"
          exit 1
        fi

    - name: gci
      root: packages/kernel
      glob: "*.go"
      run: |
        unsorted="$(gci list {staged_files})" || exit 1
        if [ -n "$unsorted" ]; then
          printf 'gci: imports not ordered (run `just fmt`):\n%s\n' "$unsorted"
          exit 1
        fi

    - name: golangci-lint
      root: packages/kernel
      glob: "*.go"
      run: golangci-lint run ./... && GOOS=js GOARCH=wasm golangci-lint run ./...

    - name: go-vet
      root: packages/kernel
      glob: "*.go"
      run: go vet ./... && GOOS=js GOARCH=wasm go vet ./...

# Pre-push repeats CI's lint job on everything that is about to leave the
# machine (typically well under a minute), so a red `main` is caught before
# the push instead of by CI. {push_files} are the files changed between the
# remote ref and the pushed commits. Never bypass this with --no-verify or
# LEFTHOOK=0 when pushing to main (see AGENTS.md).
pre-push:
  parallel: true
  jobs:
    # The exact CI command on the whole tree: lint, format and import order.
    - name: biome-ci
      run: node_modules/.bin/biome ci apps packages/protocol

    - name: typecheck-web
      glob:
        - "apps/editor-web/**/*.{ts,tsx}"
        - "packages/protocol/**/*.ts"
      run: bun run --bun --cwd apps/editor-web typecheck

    - name: typecheck-desktop
      glob: "apps/desktop/**/*.{ts,mts}"
      run: bun run --bun --cwd apps/desktop typecheck

    # One-shot `vitest related` (watch mode is blocked) for the pushed sources
    # and the tests that import them. Paths are made absolute because Vitest
    # resolves them from the package directory. jsdom needs Node, not --bun.
    - name: vitest-related-web
      glob:
        - "apps/editor-web/**/*.{ts,tsx}"
        - "packages/protocol/**/*.ts"
      run: |
        repo="$(pwd)"; set --
        for f in {push_files}; do [ -f "$f" ] && set -- "$@" "$repo/$f"; done
        [ "$#" -eq 0 ] && exit 0
        cd apps/editor-web && exec bun run vitest related --run --maxWorkers=2 --passWithNoTests "$@"

    - name: vitest-related-desktop
      glob: "apps/desktop/**/*.{ts,mts}"
      run: |
        repo="$(pwd)"; set --
        for f in {push_files}; do [ -f "$f" ] && set -- "$@" "$repo/$f"; done
        [ "$#" -eq 0 ] && exit 0
        cd apps/desktop && exec bun run --bun vitest related --run --maxWorkers=2 --passWithNoTests "$@"

    # With root set, {push_files} is relative to packages/kernel. Deleted
    # files are skipped.
    - name: go-format
      root: packages/kernel
      glob: "*.go"
      run: |
        set --
        for f in {push_files}; do [ -f "$f" ] && set -- "$@" "$f"; done
        [ "$#" -eq 0 ] && exit 0
        unformatted="$(gofumpt -l "$@")" || exit 1
        unsorted="$(gci list "$@")" || exit 1
        if [ -n "$unformatted$unsorted" ]; then
          printf 'gofumpt/gci: not formatted (run `just fmt`):\n%s\n%s\n' "$unformatted" "$unsorted"
          exit 1
        fi

    - name: go-vet
      root: packages/kernel
      glob: "*.go"
      run: go vet ./... && GOOS=js GOARCH=wasm go vet ./...
