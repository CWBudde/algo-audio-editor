# treefmt configuration — `just fmt` / `just check-formatted`

[global]
excludes = [
    "**/.git/**",
    "**/node_modules/**",
    "**/dist/**",
    "**/dist-pages/**",
    "**/go.mod",
    "**/go.sum",
    "bun.lock",
    "docs/licenses/dependencies.json",
    "apps/editor-web/public/**",
    # Generated by the shadcn CLI; kept as generated so `shadcn add` diffs stay clean.
    "apps/editor-web/src/components/ui/**",
]

# Go formatters come from tools/go.mod, at the versions CI uses.
[formatter.gofumpt]
command = "scripts/go-tool.sh"
options = ["gofumpt", "-w"]
includes = ["*.go"]

[formatter.gci]
command = "scripts/go-tool.sh"
options = ["gci", "write"]
includes = ["*.go"]
priority = 1

# Use the workspace-pinned binary: a global "biome" of another version would
# silently reformat the repo differently.
[formatter.biome]
command = "node_modules/.bin/biome"
options = ["check", "--write", "--linter-enabled=false"]
includes = ["*.ts", "*.mts", "*.tsx", "*.json"]

[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
