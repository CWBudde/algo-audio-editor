appId: com.cwbudde.algo-audio-editor
productName: Algo Audio Editor
artifactName: Algo-Audio-Editor-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: ../editor-web/dist
    to: web
asar: true
npmRebuild: false
publish:
  provider: github
  owner: cwbudde
  repo: algo-audio-editor
fileAssociations:
  - ext: wav
    name: WAV audio
    description: Waveform audio
    mimeType: audio/wav
    role: Editor
  - ext: flac
    name: FLAC audio
    role: Editor
    mimeType: audio/flac
  - ext: [aif, aiff, aifc]
    name: AIFF audio
    role: Editor
    mimeType: audio/aiff
  - ext: mp3
    name: MP3 audio
    role: Editor
    mimeType: audio/mpeg

linux:
  icon: build/icons
  executableName: algo-audio-editor
  category: AudioVideo
  syncDesktopName: true
  target:
    - AppImage
    - deb
mac:
  icon: build/icon.icns
  category: public.app-category.music
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
