name: CI

# Orchestrates the test-*.yml workflows; each one also mirrors a `just`
# recipe, and `just ci` runs all of them locally. Pages and desktop releases
# gate on this workflow by name ("CI") and file (ci.yml), so keep both stable.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    uses: ./.github/workflows/test-format.yml

  lint:
    name: Lint
    uses: ./.github/workflows/test-lint.yml

  unit:
    name: Unit
    uses: ./.github/workflows/test-unit.yml

  fuzz:
    name: Fuzz
    uses: ./.github/workflows/test-fuzz.yml

  # The browser and Electron suites are the slow part; spend those runner
  # minutes only once lint and unit tests pass.
  e2e:
    name: E2E
    needs: [lint, unit]
    uses: ./.github/workflows/test-e2e.yml
