name: test-e2e

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test; defaults to the calling workflow's commit.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: just e2e
      - name: JS and WASM size budgets
        run: just check-web-budget
      - name: Headerless Pages subpath and service-worker tests
        env:
          VITE_BASE: /algo-audio-editor/
        run: just e2e-pages
      # Retries keep a flaky test green; surface each one instead (PLAN Phase 28).
      - name: Flaky test summary
        if: always()
        run: >-
          node scripts/playwright-flaky-summary.mjs apps/editor-web/e2e
          apps/editor-web/playwright-json/browser.json
          apps/editor-web/playwright-json/pages.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-browser
          path: |
            apps/editor-web/test-results
            apps/editor-web/playwright-report
          if-no-files-found: ignore

  electron:
    name: Electron (e2e, packaged smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup
      # Electron bundles its own Chromium but needs the same system libraries.
      - name: Install Chromium system dependencies
        working-directory: apps/editor-web
        run: bunx playwright install-deps chromium
      - run: bun run --cwd apps/desktop install-electron
      - run: xvfb-run --auto-servernum just e2e-desktop
      - run: xvfb-run --auto-servernum just e2e-desktop-packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-electron
          path: apps/desktop/test-results
          if-no-files-found: ignore
