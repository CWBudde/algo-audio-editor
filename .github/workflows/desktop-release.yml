name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  # Nothing ships unless CI is green: a release tag must point at a commit on
  # main, and CI must have passed for that exact commit. A manual dispatch on
  # a branch skips the on-main check but still requires a green CI run.
  verify:
    name: Verify release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve commit
        id: commit
        run: echo "sha=$(git rev-parse "${GITHUB_SHA}^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($SHA) is not on main; refusing to release"
            exit 1
          fi
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          # A tag pushed right behind its commit races CI; wait for it.
          pending=$(gh run list --workflow ci.yml --commit "$SHA" --json databaseId,status \
            --jq '[.[] | select(.status != "completed")][0].databaseId // empty')
          if [[ -n "$pending" ]]; then
            echo "Waiting for CI run $pending on $SHA"
            gh run watch "$pending" --interval 30 > /dev/null
          fi
          passed=$(gh run list --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq length)
          if [[ "$passed" -eq 0 ]]; then
            echo "::error::No successful CI run for $SHA; refusing to release"
            exit 1
          fi
          echo "CI passed for $SHA ($passed successful run(s))"

  build:
    name: Installer (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` stamps the tag, not a bare hash
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/kernel/go.mod
          cache-dependency-path: packages/kernel/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile
      - name: Build web and desktop
        shell: bash
        run: |
          just build desktop-build
          bun run --cwd apps/desktop install-electron
      - name: Tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          if (!/^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/.test(version)) throw new Error("Invalid release tag");
          const file = "apps/desktop/package.json";
          const data = JSON.parse(fs.readFileSync(file, "utf8"));
          data.version = version;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + "\n");
          NODE
      - name: Verify signing credentials for a tagged release
        if: startsWith(github.ref, 'refs/tags/') && runner.os != 'Linux'
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          fi
      - name: Package installers
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/* && "$RUNNER_OS" != "Linux" ]]; then args+=(--config.forceCodeSigning=true); fi
          if [[ "$GITHUB_REF" != refs/tags/* && "$RUNNER_OS" == "macOS" ]]; then args+=(--config.mac.notarize=false); fi
          bun run --cwd apps/desktop package "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Attach complete platform set to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" installers/* --clobber
