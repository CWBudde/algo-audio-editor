name: test-format

on:
  workflow_call:

permissions:
  contents: read

jobs:
  treefmt:
    name: treefmt (gofumpt, gci, biome, shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Install treefmt and formatters
        run: |
          curl -fsSL https://github.com/numtide/treefmt/releases/download/v2.1.1/treefmt_2.1.1_linux_amd64.tar.gz \
            | sudo tar -C /usr/local/bin -xz treefmt
          go install mvdan.cc/gofumpt@v0.10.0
          go install github.com/daixiang0/gci@v0.14.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0
      - run: just check-formatted
