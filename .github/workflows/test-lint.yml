name: test-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go (golangci-lint, vet, tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "false"
      - name: go vet (native + js/wasm)
        working-directory: packages/kernel
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...
      - run: just check-tidy
      - name: golangci-lint (native)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: packages/kernel
      - name: golangci-lint (js/wasm bridge)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: js
          GOARCH: wasm
        with:
          version: v2.12.2
          working-directory: packages/kernel
          # The action cache key does not distinguish GOOS/GOARCH. Keep the
          # native cache above; do not restore/save it for the second target.
          skip-cache: true

  web:
    name: Web (Biome, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Biome
        run: bunx biome ci apps packages/protocol
      - name: Typecheck
        run: |
          bun run --cwd apps/editor-web typecheck
          bun run --cwd apps/desktop typecheck
      - name: Reviewed dependency licenses and notices
        run: just check-licenses
