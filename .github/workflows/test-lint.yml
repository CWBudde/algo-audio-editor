name: test-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go (golangci-lint, vet, tidy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          bun: "false"
      - name: go vet (native + js/wasm)
        working-directory: packages/kernel
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...
      - run: just check-tidy
      # The action caches its download; take the version `just lint-go` runs
      # from tools/go.mod so local and CI lint cannot drift apart.
      - name: golangci-lint version from tools/go.mod
        id: golangci
        run: echo "version=$(go -C tools list -m -f '{{.Version}}' github.com/golangci/golangci-lint/v2)" >> "$GITHUB_OUTPUT"
      - name: golangci-lint (native)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: packages/kernel
      - name: golangci-lint (js/wasm bridge)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: js
          GOARCH: wasm
        with:
          version: ${{ steps.golangci.outputs.version }}
          working-directory: packages/kernel
          # The action cache key does not distinguish GOOS/GOARCH. Keep the
          # native cache above; do not restore/save it for the second target.
          skip-cache: true

  web:
    name: Web (Biome, types)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Biome
        run: bunx biome ci apps packages/protocol
      - name: Typecheck
        run: |
          bun run --bun --cwd apps/editor-web typecheck
          bun run --bun --cwd apps/desktop typecheck
      - name: Reviewed dependency licenses and notices
        run: just check-licenses
