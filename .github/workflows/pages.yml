name: Deploy to GitHub Pages

# Deploy only what CI has proven green: run after the CI workflow finishes on
# a push to main, never straight off the push. `workflow_run` always executes
# this file from the default branch, so edits here take effect once merged.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Manual dispatch is an explicit override; otherwise only a successful CI
    # run for a push to main (not a pull request whose head branch is "main").
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Pages serves the site from /<repo>/.
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # `git describe` stamps the kernel version
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/kernel/go.mod
          cache-dependency-path: packages/kernel/go.sum
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile
      - run: just build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/editor-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
