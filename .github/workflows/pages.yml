name: Deploy to GitHub Pages

# Deploy only what CI has proven green: run after the CI workflow finishes on
# a push to main, never straight off the push. `workflow_run` always executes
# this file from the default branch, so edits here take effect once merged.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # manual dispatch looks up the commit's CI runs

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Only a successful CI run for a push to main (not a pull request whose
    # head branch is "main"). A manual dispatch redeploys, but the commit must
    # still have a successful CI run; the first step checks that.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # Pages serves the site from /<repo>/.
      VITE_BASE: /${{ github.event.repository.name }}/
      VITE_BUILD_CHANNEL: development
    steps:
      - name: CI passed for the dispatched commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [[ "$passed" -eq 0 ]]; then
            echo "::error::No successful CI run for $GITHUB_SHA; refusing to deploy"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # `git describe` stamps the kernel version
      - uses: ./.github/actions/setup
      - run: just build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/editor-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  verify:
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/pages-smoke.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
      commit: ${{ github.event.workflow_run.head_sha || github.sha }}
