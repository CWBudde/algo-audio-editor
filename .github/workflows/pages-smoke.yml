name: Verify public web demo

on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      commit:
        type: string
        required: true
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: ./.github/actions/setup
        with:
          go: "false"
          playwright: "true"
      - name: Cold-cache live verification
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.url || 'https://cwbudde.github.io/algo-audio-editor/' }}
          AAE_EXPECTED_COMMIT: ${{ inputs.commit }}
        run: just e2e-pages-live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-pages
          path: |
            apps/editor-web/test-results
            apps/editor-web/playwright-report
          if-no-files-found: ignore
