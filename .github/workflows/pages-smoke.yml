name: Verify public web demo

on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      commit:
        type: string
        required: true
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Install Playwright Chromium
        working-directory: apps/editor-web
        run: bunx playwright install --with-deps chromium
      - name: Cold-cache live verification
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.url || 'https://cwbudde.github.io/algo-audio-editor/' }}
          AAE_EXPECTED_COMMIT: ${{ inputs.commit }}
        run: just e2e-pages-live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-pages
          path: |
            apps/editor-web/test-results
            apps/editor-web/playwright-report
          if-no-files-found: ignore
